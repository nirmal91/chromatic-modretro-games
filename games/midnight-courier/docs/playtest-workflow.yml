name: Cartridge playtests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  playtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: games/midnight-courier/tests/requirements.txt
      - run: python -m pip install -r games/midnight-courier/tests/requirements.txt
      - run: python games/midnight-courier/tests/playtest.py
      - run: python games/meteor-mayhem/tests/playtest.py
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-evidence
          path: |
            games/midnight-courier/test-results/
            games/meteor-mayhem/tests/evidence/
